{% extends "base.html" %}

{% block title %}Correo enviado | Servicio Tecnico{% endblock %}

{% block content %}
<section class="py-6">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-5">
                <div class="card form-panel shadow-sm border-0">
                    <div class="card-body text-center">
                        <h2 class="fw-bold mb-3">Revisa tu correo</h2>
                        <p class="text-muted mb-3">Si el correo existe en el sistema, enviamos un enlace para restablecer la contrasena.</p>
                        <a href="{% url 'login' %}" class="btn btn-brand">Ir a iniciar sesion</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
